<style>
:root {
  --brand: #3666fd; --brand-deep: #2347c8; --brand-dark: #1a37a0;
  --ink: #16202b; --muted: #566475; --line: #d6dde6; --bad: #b3261e; --bad-soft: #fbe0dd;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
  background: var(--brand); color: var(--ink); font: 14px/1.5 var(--font-body);
  position: relative; overflow-x: hidden;
}
/* Decorative layer: soft shapes only, no content */
.deco { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.deco i { position: absolute; display: block; }
.deco .c1 { width: 520px; height: 520px; border-radius: 50%; background: rgba(255,255,255,.07); left: -160px; top: -180px; }
.deco .c2 { width: 340px; height: 340px; border-radius: 50%; border: 44px solid rgba(255,255,255,.07); right: -110px; bottom: 12%; }
.deco .c3 { width: 180px; height: 180px; border-radius: 50%; background: var(--brand-deep); opacity: .55; left: 9%; bottom: -70px; }
.deco .sq { width: 120px; height: 120px; border-radius: 28px; background: rgba(255,255,255,.09); right: 14%; top: 9%; transform: rotate(18deg); }
.deco .sq2 { width: 64px; height: 64px; border-radius: 16px; border: 6px solid rgba(255,255,255,.14); left: 16%; top: 24%; transform: rotate(-14deg); }
.deco .dots { width: 150px; height: 110px; right: 8%; bottom: 7%; opacity: .3;
  background-image: radial-gradient(#fff 2.2px, transparent 2.6px); background-size: 22px 22px; }
.deco .dots2 { width: 110px; height: 80px; left: 7%; top: 62%; opacity: .22;
  background-image: radial-gradient(#fff 2.2px, transparent 2.6px); background-size: 22px 22px; }

@media (max-width: 760px) { .deco .mark, .deco .sq2, .deco .dots2 { display: none; } }

.stack { position: relative; z-index: 1; width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.brands { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; }
.logo-air { width: 165px; height: auto; display: block; }
.logo-aluna { width: 158px; height: auto; display: block; }
.sep { width: 1px; height: 46px; background: rgba(255,255,255,.45); }
@media (max-width: 440px) { .logo-air { width: 138px; } .logo-aluna { width: 128px; } .sep { height: 40px; } .brands { flex-wrap: nowrap; gap: 14px; } }
.card { width: 100%; background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 18px 50px rgba(10, 25, 90, .35); }
h1 { font: 700 22px/1.2 var(--font-head); margin: 0 0 4px; }
p { margin: 0; }
.muted { color: var(--muted); }
form { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
.field { display: flex; flex-direction: column; gap: 4px; }
label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
input { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; min-height: 42px; width: 100%; }
input:focus-visible, button:focus-visible { outline: 3px solid rgba(54,102,253,.45); outline-offset: 1px; border-color: var(--brand); }
button { font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; border: 0; background: var(--brand); color: #fff; border-radius: 8px; padding: 10px 14px; min-height: 44px; }
button:hover { background: var(--brand-deep); }
button[disabled] { opacity: .6; cursor: not-allowed; }
.err { background: var(--bad-soft); color: var(--bad); padding: 8px 12px; border-radius: 8px; font-size: 13px; }
.link { background: none; border: 0; color: var(--muted); font-weight: 500; font-size: 14px; text-decoration: underline; padding: 4px; min-height: 0; }
.link:hover { background: none; color: var(--ink); }
.note { color: rgba(255,255,255,.88); font-size: 13px; text-align: center; max-width: 340px; text-wrap: balance; }
[hidden] { display: none !important; }
</style>

  <main class="card">
    <section id="signin" hidden>
      <h1>Contractor Review Tracker</h1>
      <p class="muted">Sign in with your work email.</p>
      <form id="loginForm">
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required autofocus></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
        <p id="loginErr" class="err" role="alert" hidden></p>
        <button id="loginBtn" type="submit">Sign in</button>
      </form>
    </section>

    <section id="change" hidden>
      <h1 id="changeTitle">Set a new password</h1>
      <p id="changeSub" class="muted">Choose your own password to continue.</p>
      <form id="changeForm">
        <div class="field"><label for="cur" id="curLabel">Temporary password</label><input id="cur" type="password" autocomplete="current-password" required></div>
        <div class="field"><label for="new1">New password (8+ characters)</label><input id="new1" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="field"><label for="new2">Repeat new password</label><input id="new2" type="password" autocomplete="new-password" minlength="8" required></div>
        <p id="changeErr" class="err" role="alert" hidden></p>
        <button id="changeBtn" type="submit">Save password</button>
        <button id="cancelChange" class="link" type="button" hidden>Back to dashboard</button>
      </form>
    </section>
  </main>
  <p class="note">Moderation human review tracker · Aluna Co. for Airtasker</p>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var voluntary = /[?&]change=1/.test(location.search);
  var typed = '';

  function post(url, body) {
    return fetch(url, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) throw new Error(data.error || ('Something went wrong (' + res.status + ')'));
          return data;
        });
      });
  }
  function showErr(id, msg) { var e = $(id); e.textContent = msg; e.hidden = !msg; }
  function showChange(isTemp) {
    $('signin').hidden = true; $('change').hidden = false;
    if (!isTemp) {
      $('changeTitle').textContent = 'Change password';
      $('changeSub').textContent = 'Enter your current password, then choose a new one.';
      $('curLabel').textContent = 'Current password';
      $('cancelChange').hidden = false;
    }
    if (typed && isTemp) $('cur').value = typed;
    (typed && isTemp ? $('new1') : $('cur')).focus();
  }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    showErr('loginErr', '');
    $('loginBtn').disabled = true;
    typed = $('password').value;
    post('/api/login', { email: $('email').value, password: typed }).then(function (me) {
      if (me.mustChange) { $('loginBtn').disabled = false; showChange(true); }
      else location.href = '/';
    }).catch(function (err) {
      $('loginBtn').disabled = false;
      showErr('loginErr', err.message);
      $('password').select();
    });
  });

  $('changeForm').addEventListener('submit', function (e) {
    e.preventDefault();
    showErr('changeErr', '');
    if ($('new1').value !== $('new2').value) { showErr('changeErr', 'The two new passwords do not match'); return; }
    $('changeBtn').disabled = true;
    post('/api/change-password', { current: $('cur').value, next: $('new1').value }).then(function () {
      location.href = '/';
    }).catch(function (err) {
      $('changeBtn').disabled = false;
      showErr('changeErr', err.message);
    });
  });
  $('cancelChange').addEventListener('click', function () { location.href = '/'; });

  fetch('/api/me', { credentials: 'same-origin' }).then(function (res) {
    if (!res.ok) return null;
    return res.json();
  }).then(function (me) {
    if (me && me.mustChange) showChange(true);
    else if (me && voluntary) showChange(false);
    else if (me) location.href = '/';
    else { $('signin').hidden = false; $('email').focus(); }
  }).catch(function () { $('signin').hidden = false; });
})();
</script>
