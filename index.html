<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contractor Review Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root {
  --bg: #f2f5f8;
  --surface: #ffffff;
  --surface-2: #e8edf3;
  --fg: #16202b;
  --muted: #566475;
  --line: #d6dde6;
  --accent: #0a6c8c;
  --accent-fg: #ffffff;
  --accent-soft: #dcEFF5;
  --good: #1b7a46;
  --good-soft: #dff3e7;
  --warn: #8f5500;
  --warn-soft: #fbeccb;
  --bad: #b3261e;
  --bad-soft: #fbe0dd;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141b;
    --surface: #17202a;
    --surface-2: #212c38;
    --fg: #e6ebf1;
    --muted: #9aa7b6;
    --line: #2b3745;
    --accent: #4cc0e0;
    --accent-fg: #06222b;
    --accent-soft: #143542;
    --good: #5fd08c;
    --good-soft: #163a27;
    --warn: #f0b34a;
    --warn-soft: #3b2d12;
    --bad: #ff8a80;
    --bad-soft: #431e1b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.
