services:
  - type: web
    name: contractor-review-tracker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contractor-review-db
          property: connectionString
      # Only used to create the very first admin account (when there are no users yet).
      - key: ADMIN_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false
      # Google Drive (optional, see DRIVE_SETUP.md). Leave empty to skip storing PDFs.
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false

databases:
  - name: contractor-review-db
    # Use a paid plan: Render's free Postgres expires after 30 days and its data is deleted.
    plan: basic-256mb
